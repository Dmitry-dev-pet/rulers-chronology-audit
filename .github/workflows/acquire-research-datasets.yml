name: Research datasets - one-shot acquisition

on:
  push:
    branches:
      - feature/research-datasets-drive-stage
    paths:
      - .github/workflows/acquire-research-datasets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download originals without executing third-party content
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p acquisition
          fetch() {
            local target="$1" url="$2"
            echo "Fetching ${target}..."
            if curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 120 \
              --user-agent "HistoricalAtlasResearch/1.0 (+https://github.com/Dmitry-dev-pet/rulers-chronology-audit)" \
              --output "acquisition/${target}.partial" "$url"; then
              mv "acquisition/${target}.partial" "acquisition/${target}"
            else
              rm -f "acquisition/${target}.partial"
              echo "::warning::Could not fetch ${target}"
            fi
          }
          fetch Archigos_4.1_stata14.dta https://www.rochester.edu/college/faculty/hgoemans/Archigos_4.1_stata14.dta
          fetch Archigos_4.1.pdf https://www.rochester.edu/college/faculty/hgoemans/Archigos_4.1.pdf
          fetch PLAD-Dataverse-YUS575.zip 'https://dataverse.harvard.edu/api/access/dataset/:persistentId/?persistentId=doi%3A10.7910%2FDVN%2FYUS575'
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          directory = pathlib.Path("acquisition")
          sources = {
              "Archigos_4.1_stata14.dta": "https://www.rochester.edu/college/faculty/hgoemans/Archigos_4.1_stata14.dta",
              "Archigos_4.1.pdf": "https://www.rochester.edu/college/faculty/hgoemans/Archigos_4.1.pdf",
              "PLAD-Dataverse-YUS575.zip": "https://dataverse.harvard.edu/api/access/dataset/:persistentId/?persistentId=doi%3A10.7910%2FDVN%2FYUS575",
          }
          findings = {}
          for name,url in sources.items():
              path = directory / name
              if not path.exists():
                  findings[name] = {"status": "download_failed", "source_url": url}
                  continue
              with path.open("rb") as stream:
                  header = stream.read(40)
              if name.endswith(".dta"):
                  valid = header.startswith(b"<stata_dta>") or (header[:1] in [bytes([113]), bytes([114]), bytes([115])])
              elif name.endswith(".pdf"):
                  valid = header.startswith(b"%PDF-")
              else:
                  valid = zipfile.is_zipfile(path)
              if not valid:
                  findings[name] = {"status": "invalid_content", "source_url": url, "bytes": path.stat().st_size}
                  path.unlink()
                  continue
              findings[name] = {
                  "status": "downloaded_unverified_historically",
                  "source_url": url,
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              if name.endswith(".zip"):
                  with zipfile.ZipFile(path) as archive:
                      findings[name]["archive_files"] = [
                          {"name": item.filename, "bytes": item.file_size}
                          for item in archive.infolist() if not item.is_dir()
                      ][:150]
          (directory / "receipt.json").write_text(json.dumps(findings, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(findings, indent=2, ensure_ascii=False))
          PY
      - name: Store short-lived private acquisition artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-source-datasets
          path: acquisition/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
