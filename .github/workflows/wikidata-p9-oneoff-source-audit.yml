# Temporary branch-scoped audit. Delete from branch after it launches.
name: Wikidata P9 temporary source claim audit
on:
  push:
    branches:
      - research/wikidata-p9-regency-moscow-tsar-types-46
permissions:
  contents: read
concurrency:
  group: p9-regent-moscow-tsar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p9-read-only:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout research source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline sourced historical office comparisons
        run: python3 -m unittest tests.test_wikidata_p9_office_types tests.test_wikidata_office_review tests.test_wikidata_sync tests.test_wikidata_jurisdiction_review tests.test_schema_v2_wikidata_roles -v
      - name: Live Wikidata P39 source reconciliation
        run: |
          set -euo pipefail
          python3 -m scripts.wikidata_sync --discover --max-searches 53 --request-delay 0.4 --json-output reports/wikidata/latest.json --markdown-output reports/wikidata/latest.md
          python3 -m scripts.wikidata_office_review --input reports/wikidata/latest.json --json-output reports/wikidata/offices.json --markdown-out reports/wikidata/offices.md
          python3 -m scripts.wikidata_jurisdiction_review --input reports/wikidata/latest.json --json-output reports/wikidata/jurisdictions.json --markdown-output reports/wikidata/jurisdictions.md
          python3 -m scripts.atlas_v2_wikidata_roles --wikidata-report reports/wikidata/latest.json --year 1790 --json-output reports/wikidata/curated-crowns.json --markdown-output reports/wikidata/curated-crowns.md --sqlite-output reports/wikidata/atlas-v2-curated-crowns.sqlite
      - name: Assert exact original eight P39 source claims and no changes to canon
        run: |
          set -euo pipefail
          git diff --exit-code -- data/atlas schemas site dist research
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/wikidata')
          latest = json.loads((root/'latest.json').read_text())
          offices = json.loads((root/'offices.json').read_text())
          j = json.loads((root/'jurisdictions.json').read_text())
          crowns = json.loads((root/'curated-crowns.json').read_text())
          evidence = json.loads(Path('research/wikidata/p9-office-claims-2026-10-13.json').read_text())
          assert not latest['mutated_canonical_data'] and not latest['historical_truth_verified']
          assert not offices['asserted_real_power'] and not offices['mutated_canonical_data']
          assert not j['actual_power_inferred'] and not j['historical_borders_verified']
          assert (latest['summary']['canonical_people'],latest['summary']['unlinked_world_people'],
              latest['summary']['confirmed_qids'])==(83,27,57)
          assert crowns['counts']['source_comparison']['matches_reviewed_snapshot']==8
          assert crowns['counts']['source_comparison']['source_changed_review_required']==0
          records={p['subject_id']:p for p in latest['records']}
          p2={x['wikidata_statement_id']:x
              for p in offices['subjects'] for x in p['positions']}
          seen=[]
          for case in evidence['cases']:
              person=records[case['canonical_person_id']]
              assert person['wikidata_id']==case['wikidata_person_qid']
              claims=[s for s in person['wikidata']['statements']['position_held']
                      if s.get('statement_id')==case['statement_id']]
              assert len(claims)==1,('Missing or multiple source statements',case['statement_id'])
              src=claims[0]
              assert src['rank']==case['rank']
              assert src['value']['qid']==case['p39_office_qid']
              assert len(src.get('references',[]))==case['p39_reference_count']
              for k,prop in (('p39_start','P580'),('p39_end','P582')):
                  value=src.get('qualifiers',{}).get(prop,[])
                  if case[k] is None: assert not value,(case['statement_id'],prop)
                  else:
                      assert len(value)==1,(case['statement_id'],prop)
                      stamp=value[0]['time']
                      assert (stamp['time'],stamp['calendar'],stamp['precision'])==(
                          case[k],case['calendar'],case['precision'])
              review=p2[case['statement_id']]
              expected='exact_office' if case['p39_office_qid']=='Q12370489' else 'office_family_only'
              assert review['decision']==expected
              assert sorted(x['canonical_tenure_id'] for x in review['candidate_canonical_tenures'])==(
                  sorted(case['expected_existing_tenure_ids']))
              seen.append(case['statement_id'])
          assert len(set(seen))==8
          assert offices['summary']['position_statements']==214
          assert offices['summary']['exact_office']==24
          assert offices['summary']['office_family_only']==10
          assert offices['summary']['unmapped']==172
          assert j['summary']['typed_claims']==58
          assert offices['summary']['unmapped']-j['summary']['typed_claims']==114
          print('P9_LIVE_EVIDENCE',json.dumps({
              'source_claims_rechecked':len(seen),
              'p39':offices['summary']['position_statements'],
              'office_exact_type':offices['summary']['exact_office'],
              'office_family':offices['summary']['office_family_only'],
              'P3_typed':j['summary']['typed_claims'],
              'unclassified_either':114,
              'curated_crown_matches':8,
              'canonical_history_changed':False},sort_keys=True))
          PY
      - name: Upload source-only research artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wikidata-p9-source-audit-2026-10-13
          path: reports/wikidata/
          if-no-files-found: error
          retention-days: 14
