# One-run, branch-isolated historical source audit. Remove after live receipt.
name: Wikidata P7 temporary Soviet office type audit
on:
  push:
    branches:
      - research/wikidata-p7-three-soviet-offices-46
permissions:
  contents: read
concurrency:
  group: wikidata-p7-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p7-readonly-source-check:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout no write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline office, jurisdiction, identity and P4 contracts
        run: python3 -m unittest tests.test_wikidata_sync tests.test_wikidata_office_review tests.test_wikidata_jurisdiction_review tests.test_schema_v2_wikidata_roles -v
      - name: Live Wikidata reconciliation with no writes
        run: |
          set -euo pipefail
          python3 -m scripts.wikidata_sync --discover --max-searches 53 --request-delay 0.4 --json-output reports/wikidata/latest.json --markdown-output reports/wikidata/latest.md
          python3 -m scripts.wikidata_office_review --input reports/wikidata/latest.json --json-output reports/wikidata/offices.json --markdown-out reports/wikidata/offices.md
          python3 -m scripts.wikidata_jurisdiction_review --input reports/wikidata/latest.json --json-output reports/wikidata/jurisdictions.json --markdown-output reports/wikidata/jurisdictions.md
          python3 -m scripts.atlas_v2_wikidata_roles --wikidata-report reports/wikidata/latest.json --year 1790 --json-output reports/wikidata/curated-crowns.json --markdown-output reports/wikidata/curated-crowns.md --sqlite-output reports/wikidata/atlas-v2-curated-crowns.sqlite
      - name: Audit untouched canon and exact typed QID assignment
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- data/atlas schemas site dist research
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          r=lambda k:json.loads(Path('reports/wikidata/'+k+'.json').read_text())
          w,o,j,c=r('latest'),r('offices'),r('jurisdictions'),r('curated-crowns')
          assert w['historical_truth_verified'] is False
          assert w['mutated_canonical_data'] is False
          assert (w['summary']['canonical_people'],w['summary']['unlinked_world_people'],w['summary']['confirmed_qids']) == (83,27,57)
          assert not o['asserted_real_power'] and not o['mutated_canonical_data']
          assert not j['actual_power_inferred'] and not j['historical_borders_verified'] and not j['mutated_canonical_data']
          assert c['counts']['source_comparison']['matches_reviewed_snapshot'] == 8
          assert c['counts']['source_comparison']['source_changed_review_required'] == 0
          p39=Counter()
          for p in w['records']:
              for s in p.get('wikidata',{}).get('statements',{}).get('position_held',[]):
                  if s.get('rank')!='deprecated':
                      p39[s.get('value',{}).get('qid')]+=1
          for qid in ('Q15628644','Q115135185','Q135215773'):
              print('P7_QID_COUNT',qid,p39[qid])
          assert j['summary']['role_legislative_membership'] == p39['Q15628644']
          assert j['summary']['role_party_candidate_membership'] == p39['Q115135185']
          assert any(pos['wikidata_office_qid']=='Q135215773' and pos['decision']=='exact_office'
              for p in o['subjects'] for pos in p['positions'])
          assert not set(['Q15628644','Q115135185']) & set([row['wikidata_office_qid']
              for p in o['subjects'] for row in p['positions'] if row['decision']=='exact_office'])
          total=w['summary']['confirmed_qids']
          unmapped=o['summary']['unmapped']-j['summary']['typed_claims']
          print('LIVE_SUMMARY',json.dumps({'people':len(w['records']),'linked':total,'p39':o['summary']['position_statements'],
              'p2':o['summary'],'p3':j['summary'],'remaining_unmapped_either':unmapped,
              'p4':c['counts']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload only time-limited research artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wikidata-p7-live-2026-10-13
          path: reports/wikidata/
          if-no-files-found: error
          retention-days: 14
