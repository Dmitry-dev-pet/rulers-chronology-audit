# Temporary branch-only, source-read-only research execution for issue #46.
# Remove this workflow on this PR branch after retrieving the evidence.
name: Wikidata P6 ephemeral read-only verification
on:
  push:
    branches:
      - research/wikidata-p6-identity-batch-46
permissions:
  contents: read
concurrency:
  group: wikidata-p6-temporary-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wikidata-live-p6:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test identity and office contracts offline
        run: python3 -m unittest tests.test_wikidata_sync tests.test_wikidata_office_review tests.test_wikidata_jurisdiction_review tests.test_schema_v2_wikidata_roles -v
      - name: Run live Wikidata identity and P39 discovery (no writes)
        run: |
          set -euo pipefail
          python3 -m scripts.wikidata_sync --discover --max-searches 107 --request-delay 0.4 --json-output reports/wikidata/latest.json --markdown-output reports/wikidata/latest.md
          python3 -m scripts.wikidata_office_review --input reports/wikidata/latest.json --json-output reports/wikidata/offices.json --markdown-output reports/wikidata/offices.md
          python3 -m scripts.wikidata_jurisdiction_review --input reports/wikidata/latest.json --json-output reports/wikidata/jurisdictions.json --markdown-output reports/wikidata/jurisdictions.md
          python3 -m scripts.atlas_v2_wikidata_roles --wikidata-report reports/wikidata/latest.json --year 1790 --json-output reports/wikidata/curated-crowns.json --markdown-output reports/wikidata/curated-crowns.md --sqlite-output reports/wikidata/atlas-v2-curated-crowns.sqlite
      - name: Verify source immutability and summarize counts
        run: |
          set -euo pipefail
          git diff --exit-code -- data/atlas schemas site dist research
          python3 - <<'PY'
          import json
          from pathlib import Path
          for n in ('latest','offices','jurisdictions','curated-crowns'):
              data=json.loads(Path(f'reports/wikidata/{n}.json').read_text())
              print(n, json.dumps(data.get('summary',data.get('counts',{})),ensure_ascii=False,sort_keys=True))
              assert data.get('mutated_canonical_data',False) is False
          report=json.loads(Path('reports/wikidata/latest.json').read_text())
          print('ROSTER:',len(report['records']), 'CONFIRMED:',report['summary']['confirmed_qids'])
          assert report['summary']['canonical_people']==83
          assert report['summary']['unlinked_world_people']==27
          assert report['summary']['confirmed_qids']==57
          PY
      - name: Upload read-only evidence as private workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wikidata-p6-2026-10-13-live-audit
          path: reports/wikidata/
          if-no-files-found: error
          retention-days: 14
