name: Historical atlas audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  public:

permissions:
  contents: read

concurrency:
  group: soviet-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test validators, migration contracts and renderers
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
          python3 -m scripts.atlas_db validate

      - name: Build compatible report and normalized database
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/soviet_audit.py --revision "$SOURCE_REVISION"
          python3 -m scripts.extend_century
          python3 -m scripts.extend_romanovs
          python3 -m scripts.extend_muscovy
          python3 -m scripts.atlas_db build
          python3 -m scripts.smuta_map --revision "$SOURCE_REVISION"

      # P4 is a PR-only, explicitly opt-in SPA preview. No Pages deployment.
      - name: Build experimental P4 graph in separate preview folder
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.atlas_v2_graph_preview --dist dist --output p4-preview

      - name: Test actual Chromium navigation and four viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/atlas-browser
          /tmp/atlas-browser/bin/pip install --disable-pip-version-check playwright==1.56.0
          /tmp/atlas-browser/bin/python -m playwright install --with-deps chromium
          /tmp/atlas-browser/bin/python tests/browser_smuta_map.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_universal_atlas.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_mobile_atlas.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_world_pilot.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_dynasty_network.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_dynasty_1800.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_house_footprints.py --dist dist --output browser-evidence
          /tmp/atlas-browser/bin/python tests/browser_coverage_matrix.py --dist dist --output browser-evidence

      - name: Test experimental P4 graph at desktop and mobile sizes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/atlas-browser/bin/python tests/browser_schema_v2_graph.py --dist p4-preview --output browser-evidence

      - name: Simulate existing Pages v2.html publication (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.atlas_v2_pages --dist dist

      - name: Browser-test standalone Pages /v2.html (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/atlas-browser/bin/python tests/browser_schema_v2_graph.py \
            --dist dist --entry v2.html --output browser-evidence/pages-v2

      - name: Browser-test 1788 world authority and source classifications
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/atlas-browser/bin/python tests/browser_world_authority.py \
            --dist dist --output browser-evidence/world-authority

      - name: Browser-test source-qualified authority epochs 1688 and 1888
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/atlas-browser/bin/python tests/browser_authority_epochs.py \
            --dist dist --output browser-evidence/world-epochs

      - name: Browser-test source-based world research coverage matrix
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/atlas-browser/bin/python tests/browser_world_coverage.py \
            --dist dist --output browser-evidence/research-coverage

      - name: Record result in job summary
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('dist/atlas-manifest.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# Historical atlas 1417–1991: structural validation passed\n\n')
              for key, value in r['counts'].items():
                  f.write(f'{key}: **{value}**  \n')
              f.write('\nThis is NOT historical fact-checking. Uncertainty and parallel offices are preserved.\n\n')
              f.write('Artifact: compatible report, normalized JSON, SQLite, sourced Smuta place explorer and checksums. No source photograph.\n')
              browser = json.loads(Path('browser-evidence/receipt.json').read_text())
              f.write('\nBrowser acceptance: ' + str(len(browser)) + ' local/history scenarios passed.\n')
              global_browser = json.loads(Path('browser-evidence/universal-receipt.json').read_text())
              f.write('Universal atlas: ' + str(len(global_browser)) + ' viewport scenarios passed (1417–1991 navigation and cross-year comparisons).\n')
              f.write('Screenshots and receipts are a separate test artifact.\n')
              mobile = json.loads(Path('browser-evidence/mobile-receipt.json').read_text())
              f.write('Mobile-first UX: ' + str(len(mobile)) + ' viewport scenarios passed (summary, timeline, bottom sheet, comparison, biography).\n')
          PY

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smuta-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: Upload P4 historical graph preview (PR only)
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-atlas-v2-graph-preview
          path: p4-preview/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Upload report and database without original photo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soviet-chronology-report
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
