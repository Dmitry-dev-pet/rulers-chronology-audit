# One-run source-read-only P10 historical audit; remove after dispatch.
name: Wikidata P10 Soviet executive source check
on:
  push:
    branches:
      - research/wikidata-p10-soviet-government-offices-46
permissions:
  contents: read
concurrency:
  group: wikidata-p10-oneoff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p10-live-source-verification:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test all P10 and existing Wikidata contracts offline
        run: python3 -m unittest tests.test_wikidata_p10_government_offices tests.test_wikidata_office_review tests.test_wikidata_jurisdiction_review tests.test_wikidata_sync tests.test_schema_v2_wikidata_roles -v
      - name: Reconcile current Wikidata source claims without writing
        run: |
          set -euo pipefail
          python3 -m scripts.wikidata_sync --discover --max-searches 53 --request-delay 0.4 --json-output reports/wikidata/latest.json --markdown-output reports/wikidata/latest.md
          python3 -m scripts.wikidata_office_review --input reports/wikidata/latest.json --json-output reports/wikidata/offices.json --markdown-output reports/wikidata/offices.md
          python3 -m scripts.wikidata_jurisdiction_review --input reports/wikidata/latest.json --json-output reports/wikidata/jurisdictions.json --markdown-output reports/wikidata/jurisdictions.md
          python3 -m scripts.atlas_v2_wikidata_roles --wikidata-report reports/wikidata/latest.json --year 1790 --json-output reports/wikidata/curated-crowns.json --markdown-output reports/wikidata/curated-crowns.md --sqlite-output reports/wikidata/atlas-v2-curated-crowns.sqlite
      - name: Preserve P39 claim ids / calendars / rank / separate offices and canonical history
        run: |
          set -euo pipefail
          git diff --exit-code -- data/atlas schemas site dist research
          python3 - <<'PY'
          import json
          from pathlib import Path
          read=lambda n:json.loads(Path(f'reports/wikidata/{n}.json').read_text())
          latest,offices,juris,crowns=[read(n) for n in ('latest','offices','jurisdictions','curated-crowns')]
          source=json.loads(Path('research/wikidata/p10-soviet-government-claims-2026-10-13.json').read_text())
          assert latest['schema_version']=='wikidata-reconciliation-v1'
          assert latest['historical_truth_verified'] is False
          assert latest['mutated_canonical_data'] is False
          assert not offices['asserted_real_power'] and not offices['mutated_canonical_data']
          assert not juris['actual_power_inferred'] and not juris['historical_borders_verified']
          assert not juris['mutated_canonical_data']
          assert (latest['summary']['canonical_people'],latest['summary']['unlinked_world_people'],latest['summary']['confirmed_qids'])==(83,27,57)
          subjects={p['subject_id']:p for p in latest['records']}
          p2_by_id={p['wikidata_statement_id']:p for person in offices['subjects'] for p in person['positions']}
          p3_by_id={p['wikidata_statement_id']:p for person in juris['subjects'] for p in person['positions']}
          assert len(source['cases'])==12
          for x in source['cases']:
              subject=subjects[x['canonical_person_id']]
              assert subject['wikidata_id']==x['person_qid']
              claims=[s for s in subject['wikidata']['statements']['position_held'] if s.get('statement_id')==x['statement_id']]
              assert len(claims)==1,('source statement missing or duplicated',x['statement_id'])
              claim=claims[0]
              assert claim['rank']==x['rank'] and claim['value']['qid']==x['office_qid']
              assert len(claim.get('references',[]))==x['wikidata_reference_count']
              for prop,key in (('P580','start_time'),('P582','end_time')):
                  q=claim.get('qualifiers',{}).get(prop,[])
                  assert len(q)==1,(x['statement_id'],prop)
                  time=q[0]['time']
                  assert (time['time'],time['calendar'],time['precision'])==(
                     x[key]['time'],x[key]['calendar'],x[key]['precision'])
              p2=p2_by_id[x['statement_id']]
              if x['office_qid']=='Q56919889':
                  assert p2['decision']=='exact_office'
                  assert x['statement_id'] not in p3_by_id
                  assert p2['mapping']['office_id']=='snk-rsfsr'
              else:
                  assert p2['decision']=='unmapped_wikidata_office'
                  p3=p3_by_id[x['statement_id']]
                  assert p3['legal_role_classification'] in {'government_deputy','government_first_deputy'}
                  assert p3['office_rank']==('first_deputy' if x['office_qid']=='Q5452917' else 'deputy')
                  assert p3['government_title_era']==('pre_1946_snk' if x['office_qid']=='Q134407102' else 'post_1946_sovmin')
                  assert p3['actual_power_verified'] is False
          assert offices['summary']['position_statements']==214
          assert offices['summary']['exact_office']==26
          assert offices['summary']['office_family_only']==10
          assert offices['summary']['external_only']==7
          assert offices['summary']['unmapped']==170
          assert juris['summary']['typed_claims']==68
          assert juris['summary']['role_government_deputy']==7
          assert juris['summary']['role_government_first_deputy']==3
          assert offices['summary']['unmapped']-juris['summary']['typed_claims']==102
          assert crowns['counts']['source_comparison']['matches_reviewed_snapshot']==8
          assert crowns['counts']['source_comparison']['source_changed_review_required']==0
          print("P10_VERIFIED",json.dumps({"people":110,"reviewed_qids":57,"P39":214,
             "claims_checked":12,"p2_exact_type":26,"p2_family":10,"p2_external":7,
             "p3_type":68,"residual_unmapped":102,"p4_crowns_unchanged":8,
             "canonical_history_changed":False},sort_keys=True))
          PY
      - name: Save research-only audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wikidata-p10-live-2026-10-13
          path: reports/wikidata/
          if-no-files-found: error
          retention-days: 14
