name: Historical Atlas MCP image

on:
  pull_request:
    branches: [main]
    paths:
      - data/atlas/**
      - schemas/atlas.sql
      - scripts/atlas_db.py
      - scripts/atlas_mcp.py
      - scripts/atlas_mcp_http.py
      - scripts/atlas_mcp_query.py
      - scripts/archigos_returnees.py
      - tests/test_atlas_mcp_http.py
      - ops/mcp/**
      - .dockerignore
      - .github/workflows/historical-mcp-image.yml
  push:
    branches: [main]
    paths:
      - data/atlas/**
      - schemas/atlas.sql
      - scripts/atlas_db.py
      - scripts/atlas_mcp.py
      - scripts/atlas_mcp_http.py
      - scripts/atlas_mcp_query.py
      - scripts/archigos_returnees.py
      - tests/test_atlas_mcp_http.py
      - ops/mcp/**
      - .dockerignore
      - .github/workflows/historical-mcp-image.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned SDK for contract tests and host-side smoke
        run: python3 -m pip install --disable-pip-version-check 'mcp==2.0.0'
      - name: Verify private HTTP read-only allowlist and original domain protocol
        run: |
          python3 -m unittest discover -s tests -p 'test_atlas_mcp*.py' -v
      - name: Validate review-only private tunnel overlay without credentials
        shell: bash
        env:
          ATLAS_TUNNEL_IMAGE_REF: ghcr.io/openai/tunnel-client@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ATLAS_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
          ATLAS_TUNNEL_RUNTIME_KEY_FILE: ${{ runner.temp }}/non-secret-placeholder
        run: |
          set -euo pipefail
          printf 'services:\n  app:\n    image: busybox:1.36\n' > "$RUNNER_TEMP/atlas-base.test.yml"
          printf 'not-a-real-runtime-key\n' > "$ATLAS_TUNNEL_RUNTIME_KEY_FILE"
          chmod 0600 "$ATLAS_TUNNEL_RUNTIME_KEY_FILE"
          docker compose -p atlas-overlay-contract \
            -f "$RUNNER_TEMP/atlas-base.test.yml" \
            -f ops/mcp/tunnel.compose.review.yml \
            config --format json > "$RUNNER_TEMP/atlas-tunnel-config.json"
          python3 - "$RUNNER_TEMP/atlas-tunnel-config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          client = data["services"]["tunnel-client"]
          assert set(data["services"]) == {"app", "tunnel-client"}
          assert client["environment"]["MCP_SERVER_URL"] == "http://app:8765/mcp"
          assert client["environment"]["CONTROL_PLANE_TUNNEL_ID"].startswith("tunnel_")
          assert client["read_only"] is True
          assert client["cap_drop"] == ["ALL"]
          assert not client.get("privileged")
          assert not client.get("network_mode")
          ports = client["ports"]
          assert len(ports) == 1 and ports[0]["host_ip"] == "127.0.0.1"
          assert ports[0]["published"] == "8021" and ports[0]["target"] == 8080
          assert client["secrets"][0]["source"] == "atlas_openai_tunnel_runtime_key"
          assert client["command"] == [
              "--control-plane.api-key=file:/run/secrets/atlas_openai_tunnel_runtime_key"
          ]
          print("Review-only tunnel overlay: private, no credentials, no deployment")
          PY

      - name: Build exact source image, no credentials
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE_REF=$image" >> "$GITHUB_ENV"
          docker build --pull --file ops/mcp/Dockerfile --tag "$image" .
      - name: Smoke actual image over local MCP HTTP
        run: bash ops/mcp/smoke.sh "$IMAGE_REF"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned SDK for smoke
        run: python3 -m pip install --disable-pip-version-check 'mcp==2.0.0'
      - name: Rebuild and smoke the exact main commit
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE_REF=$image" >> "$GITHUB_ENV"
          docker build --pull --file ops/mcp/Dockerfile --tag "$image" .
          bash ops/mcp/smoke.sh "$image"
      - name: Authenticate to GHCR AFTER smoke
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish by full immutable git SHA
        run: docker push "$IMAGE_REF"
