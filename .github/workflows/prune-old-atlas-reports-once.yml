name: Prune duplicate successful atlas report artifacts once

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-old-atlas-reports-once.yml]
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete old successful duplicate reports (manual defaults to dry-run)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: atlas-report-prune-once
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.repository == 'Dmitry-dev-pet/rulers-chronology-audit' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      APPLY: ${{ github.event_name == 'push' || inputs.apply == true }}
    steps:
      - name: Prune old successful report archives, preserve live review and errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          from datetime import datetime, timedelta, timezone
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          REPO = "Dmitry-dev-pet/rulers-chronology-audit"
          NAME = "soviet-chronology-report"
          KEEP_MAIN = 5
          MAX_DELETES = 250
          MAX_BYTES = 85 * 1048576
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          token = os.environ["GH_TOKEN"]
          APPLY = os.getenv("APPLY", "").lower() == "true"

          def api(path, method="GET"):
              req = Request("https://api.github.com/repos/" + REPO + path,
                  method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "atlas-bounded-report-pruner"})
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None

          def pages(path):
              results = []
              for page in range(1, 8):
                  delim = "&" if "?" in path else "?"
                  result = api(path + delim + urlencode({"per_page": 100, "page": page}))
                  batch = result["artifacts"]
                  results.extend(batch)
                  if len(batch) < 100:
                      return results
              raise RuntimeError("Too many artifact pages")

          arts = pages("/actions/artifacts?name=" + NAME)
          open_prs = api("/pulls?state=open&per_page=100")
          if len(open_prs) >= 100:
              raise RuntimeError("PR pagination not covered; refuse deletion")
          open_heads = {
              pr["head"]["ref"] for pr in open_prs
              if (pr.get("head", {}).get("repo") or {}).get("full_name") == REPO
          }
          runs = {}
          for a in arts:
              if a.get("name") != NAME or not a.get("workflow_run"):
                  raise RuntimeError("Artifact name or run association mismatch")
              rid = int(a["workflow_run"]["id"])
              if rid not in runs:
                  runs[rid] = api("/actions/runs/" + str(rid))

          main_success = sorted(
              (a for a in arts
               if runs[int(a["workflow_run"]["id"])].get("conclusion") == "success"
               and runs[int(a["workflow_run"]["id"])].get("event") == "push"
               and runs[int(a["workflow_run"]["id"])].get("head_branch") == "main"),
              key=lambda a: a["created_at"], reverse=True)
          if len(main_success) < KEEP_MAIN:
              raise RuntimeError("Insufficient successful main report baselines")
          keep_main = {int(a["workflow_run"]["id"]) for a in main_success[:KEEP_MAIN]}
          cutoff = datetime.now(timezone.utc) - timedelta(hours=12)
          candidate, reasons = [], collections.Counter()
          for a in arts:
              rid = int(a["workflow_run"]["id"])
              run = runs[rid]
              created = datetime.fromisoformat(a["created_at"].replace("Z", "+00:00"))
              if a.get("expired"):
                  reasons["expired"] += 1
              elif created >= cutoff:
                  reasons["younger_than_12h"] += 1
              elif run.get("status") != "completed" or run.get("conclusion") != "success":
                  reasons["failure_or_incomplete"] += 1
              elif rid in keep_main:
                  reasons["five_latest_main"] += 1
              elif run.get("event") == "pull_request" and (
                  not run.get("head_branch") or run["head_branch"] in open_heads):
                  reasons["open_or_unknown_pr"] += 1
              elif run.get("event") == "push" and run.get("head_branch") == "main":
                  candidate.append(a)
              elif run.get("event") == "pull_request":
                  candidate.append(a)
              else:
                  reasons["other_event"] += 1

          total = sum(int(a["size_in_bytes"]) for a in candidate)
          if len(candidate) > MAX_DELETES or total > MAX_BYTES:
              raise RuntimeError("Deletion count or volume exceeds safety bound")
          print(json.dumps({
              "mode": "APPLY" if APPLY else "DRY RUN",
              "artifact": NAME,
              "candidates": len(candidate),
              "candidate_mib": round(total / 1048576, 2),
              "protected": dict(reasons),
              "open_PR_branches": sorted(open_heads),
          }, indent=2), flush=True)
          deleted = 0
          for a in candidate:
              if APPLY:
                  api("/actions/artifacts/" + str(a["id"]), method="DELETE")
                  deleted += int(a["size_in_bytes"])
                  print("DELETED id=%s run=%s bytes=%s" %
                        (a["id"], a["workflow_run"]["id"], a["size_in_bytes"]), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## One-time duplicate atlas report cleanup\n\n")
              f.write("- Mode: %s\n" % ("APPLY" if APPLY else "DRY RUN"))
              f.write("- Candidates: %d (%.2f MiB)\n" % (len(candidate), total / 1048576))
              f.write("- Deleted: %.2f MiB\n" % (deleted / 1048576))
              f.write("- Protected: %s\n" % dict(reasons))
              f.write("- Pages, browser failures, historical sources and open PR artifacts untouched.\n")
          PY
