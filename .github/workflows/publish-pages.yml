name: Publish historical atlas and database to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - scripts/soviet_audit.py
      - scripts/extend_century.py
      - scripts/extend_romanovs.py
      - scripts/extend_muscovy.py
      - scripts/atlas_db.py
      - scripts/transition_cases.py
      - scripts/smuta_map.py
      - schemas/**
      - data/atlas/**
      - data/cartography/**
      - data/muscovy-chronology.json
      - data/muscovy-period-review.csv
      - research/muscovy-sources.md
      - data/early-romanov-chronology.json
      - data/early-romanov-period-review.csv
      - research/early-romanov-sources.md
      - data/imperial-chronology.json
      - data/imperial-period-review.csv
      - research/imperial-sources.md
      - site/**
      - tests/**
      - data/soviet-parallel-chronology.json
      - data/soviet-period-review.csv
      - data/poster-transcription.tsv
      - research/soviet-parallel-sources.md
      - research/soviet-period-sources.md
  workflow_dispatch:

# Only reviewed main can publish. Neither build nor publication writes source data.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soviet-chronology-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build report and database
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 -m scripts.atlas_db validate
          python3 scripts/soviet_audit.py --revision "$GITHUB_SHA"
          python3 -m scripts.extend_century
          python3 -m scripts.extend_romanovs
          python3 -m scripts.extend_muscovy
          python3 -m scripts.atlas_db build
          python3 -m scripts.smuta_map --revision "$GITHUB_SHA"

      - name: Verify exact public allowlist, privacy, checksums and SQLite integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, sqlite3
          dist = Path('dist')
          expected = {
              'index.html', 'site.css', 'site.js', 'year-view.js', 'transition-view.js', 'universal-atlas.js', 'mobile-atlas.js', 'world-atlas.js', 'world-1762.json', 'README.md',
              'chronology.json', 'sources.json', 'validation.json',
              'party.csv', 'imperial.csv', 'romanov.csv', 'muscovy.csv',
              'government.csv', 'state_institutions.csv', 'separate_records.csv', 'SHA256SUMS',
              'atlas.json', 'atlas.sqlite', 'atlas-manifest.json', 'atlas-schema.sql', 'database.html', 'transition-cases.json',
              'smuta-map.js', 'smuta-map.css', 'smuta-map.json',
          }
          actual = {p.name for p in dist.iterdir() if p.is_file()}
          assert actual == expected, f'Unexpected site files: {actual ^ expected}'
          assert all(p.is_file() for p in dist.iterdir()), 'No nested artifacts'
          for path in dist.iterdir():
              content = path.read_bytes()
              assert b'drive.google.com' not in content, f'Drive reference: {path}'
              assert b'1000428575.jpg' not in content, f'Photo reference: {path}'
              if path.suffix == '.sqlite':
                  assert content.startswith(b'SQLite format 3\0')
              else:
                  content.decode('utf-8-sig')
          for line in (dist/'SHA256SUMS').read_text().splitlines():
              checksum, name = line.split('  ')
              assert hashlib.sha256((dist/name).read_bytes()).hexdigest() == checksum
          for name in ('validation.json', 'atlas-manifest.json', 'smuta-map.json'):
              assert json.loads((dist/name).read_text())['historical_truth_verified_by_ci'] is False
          map_data = json.loads((dist/'smuta-map.json').read_text())
          assert map_data['historical_borders_verified'] is False
          assert map_data['coordinate_kind'] == 'modern_reference_only'
          con = sqlite3.connect(f'file:{(dist/"atlas.sqlite").resolve()}?mode=ro', uri=True)
          assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert con.execute('PRAGMA foreign_key_check').fetchall() == []
          con.close()
          print('Public report and derived database checked; original photo excluded.')
          PY

      - name: Configure Pages for GitHub Actions
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static website and derived database
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
      - name: Deploy public site
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record deployment
        if: success()
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        shell: bash
        run: |
          {
            echo '## Historical atlas and database published'
            echo "Site: ${SITE_URL}"
            echo "Smuta map: ${SITE_URL}?map=smuta#/timeline/1608"
            echo "Database browser: ${SITE_URL}database.html"
            echo 'CI validates structure, not historical truth. Original photo remains private.'
          } >> "$GITHUB_STEP_SUMMARY"
