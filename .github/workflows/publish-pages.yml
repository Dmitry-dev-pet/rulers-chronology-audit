name: Publish Soviet chronology to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - scripts/soviet_audit.py
      - scripts/extend_century.py
      - scripts/extend_romanovs.py
      - scripts/extend_muscovy.py
      - data/muscovy-chronology.json
      - data/muscovy-period-review.csv
      - research/muscovy-sources.md
      - data/early-romanov-chronology.json
      - data/early-romanov-period-review.csv
      - research/early-romanov-sources.md
      - data/imperial-chronology.json
      - data/imperial-period-review.csv
      - research/imperial-sources.md
      - site/**
      - tests/**
      - data/soviet-parallel-chronology.json
      - data/soviet-period-review.csv
      - data/poster-transcription.tsv
      - research/soviet-parallel-sources.md
  workflow_dispatch:

# Pages writes cannot run on unreviewed pull request code.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soviet-chronology-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate chronology with offline tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/soviet_audit.py --revision "$GITHUB_SHA"
          python3 -m scripts.extend_century
          python3 -m scripts.extend_romanovs
          python3 -m scripts.extend_muscovy

      - name: Assert public output contains no private source images or Drive references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          dist = Path("dist")
          expected = {
              "index.html", "site.css", "site.js", "README.md",
              "chronology.json", "sources.json", "validation.json",
              "party.csv", "imperial.csv", "romanov.csv", "muscovy.csv", "government.csv", "state_institutions.csv",
              "separate_records.csv", "SHA256SUMS",
          }
          actual = {p.name for p in dist.iterdir() if p.is_file()}
          assert actual == expected, f"Unexpected site files: {actual ^ expected}"
          assert all(p.is_file() for p in dist.iterdir()), "Nested site artifacts are not allowed"
          for path in dist.iterdir():
              content = path.read_text(encoding="utf-8-sig")
              assert "drive.google.com" not in content, f"Drive reference in public site: {path}"
              assert "1000428575.jpg" not in content, f"Source photo reference in public site: {path}"
          check = json.loads((dist / "validation.json").read_text(encoding="utf-8"))
          assert check["historical_truth_verified_by_ci"] is False
          print("Site is a public, self-contained research report without source photo.")
          PY

      - name: Configure Pages for GitHub Actions
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/

      - name: Deploy public site
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Write verified deployment URL in run summary
        if: success()
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Soviet chronology — published"
            echo
            echo "Site: ${SITE_URL}"
            echo
            echo "Research caveat: CI validates data structure, not the historical accuracy of claims."
            echo "Original photograph remains private in Google Drive and is not included."
          } >> "$GITHUB_STEP_SUMMARY"
